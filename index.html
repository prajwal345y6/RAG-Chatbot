<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h2 {
            color: #00d7a3;
        }
        .container {
            background-color: #2e2e3e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 60%;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #00d7a3;
        }
        select, input[type="text"], button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            background-color: #3e3e4e;
            color: #e0e0e0;
        }
        button {
            background-color: #00d7a3;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #00c29a;
        }
        .results {
            background-color: #2e2e3e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 60%;
            overflow-x: auto;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 16px;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .result-item {
            background-color: #3e3e4e;
            border-left: 4px solid #00d7a3;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }
        .image-gallery {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .image-gallery img {
            max-width: 800px;
            border-radius: 8px;
            border: 2px solid #00d7a3;
        }
    </style>
</head>
<body>
    <h2>Chat AI</h2>
    <div class="container">
        <form method="POST">
            <label for="folder_name">Select Tower:</label>
            <select id="folder_name" name="folder_name" required>
                <option value="">Select Tower</option>
                <option value="wintel">Wintel</option>
                <option value="network">Network</option>
                <option value="backup">Backup</option>
                <option value="network security">Network Security</option>
                <option value="platform security">Platform Security</option>
                <option value="storage">Storage</option>
                <option value="voice and video">Voice and Video</option>
                <option value="access management">Access Management</option>
            </select>
            <label for="query">How Can I Help You?</label>
            <input type="text" id="query" name="query" required placeholder="Enter your query...">
            <button type="submit">Search</button>
        </form>
    </div>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% if results %}
    <div class="results">
        <h3>Results:</h3>
        <pre>{{ results }}</pre>

        {% if images %}
        <div class="image-gallery">
            {% for image in images %}
                <img src="data:image/png;base64,{{ image }}" alt="Extracted Image">
            {% endfor %}
        </div>
        {% endif %}
    </div>
{% endif %}
</body>
</html>
